{% extends 'base.html' %}
{% block content %}

<!-- Card horizontal para cada noticia -->
<div class="news-container mt-4">
  {% for news in newss %}
    <div class="card news-card mb-3">
      <div class="row g-0">
        <div class="col-md-8">
          <div class="card-body">
            <div class="news-tag">📰 Latest News</div>
            <h5 class="card-title">{{ news.headline }}</h5>
            <p class="news-body">{{ news.body|linebreaks }}</p>
            <p class="card-text">
              <small class="text-muted">{{ news.date }}</small>
            </p>
          </div>
        </div>
      </div>
    </div>
  {% endfor %}
</div>

{% endblock content %}
